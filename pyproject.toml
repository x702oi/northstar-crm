[build-system]
requires = ["flit_core>=3.4,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "northstar_crm"
authors = [
  { name = "Northstar CRM Team", email = "engineering@example.com" }
]
description = "Enterprise customer relationship management for Frappe Framework"
readme = "README.md"
requires-python = ">=3.11"
dynamic = ["version"]
dependencies = []
classifiers = [
  "Framework :: Frappe",
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License"
]

[tool.bench.frappe-dependencies]
frappe = ">=16.0.0,<17.0.0"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

